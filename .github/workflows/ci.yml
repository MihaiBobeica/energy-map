name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Verify source data
        run: bash scripts/verify-data.sh public/data

      - name: Build
        run: npm run build

      # Catches the silent class of failure where the bundle references an
      # asset (worker, wasm) that the build never emitted: a runtime 404 with
      # no console error and no visible symptom other than a broken feature.
      - name: Verify every referenced asset was emitted
        run: npm run verify:assets

      - name: Verify built data and scan for forbidden content
        run: bash scripts/verify-data.sh dist/data dist

      - name: Check site size against GitHub Pages limit
        run: bash scripts/check-site-size.sh dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pipeline:
    name: Pipeline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline package
        run: pip install -e ./pipeline[dev]

      - name: Pipeline tests
        run: pytest pipeline

      - name: Verify deployable data output
        run: energy-map-pipeline verify-output --data-root public/data
