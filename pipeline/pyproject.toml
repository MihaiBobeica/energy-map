[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-map-pipeline"
version = "0.1.0"
description = "Offline data pipeline for the Energy Map static site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "requests>=2.32",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Heavy geospatial dependencies are isolated here until the phases that need
# them (tiles, rasters); see docs/architecture.md ADR-6.
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "rasterio>=1.3",
    "xarray>=2024.6",
]
dev = [
    "pytest>=8.2",
]

[project.scripts]
energy-map-pipeline = "energy_map_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["energy_map_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
